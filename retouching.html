<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Retouching gallery by Cup of Jay — every frame shown before and after the retouch">
    <title>Retouching | Cup of Jay</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="gallery.css?v=7">
    <link rel="stylesheet" href="theme-toggle.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark-mode';
            document.documentElement.className = theme;
        })();
    </script>
</head>
<body class="dark-mode">
    <!-- Mobile Navigation (outside hero so fixed positioning works correctly) -->
    <input type="checkbox" id="mobile-nav-toggle" class="mobile-nav__checkbox">

    <!-- Mobile nav frosted bar (shown on scroll) -->
    <div class="mobile-nav__bar"></div>

    <!-- Mobile Logo -->
    <div class="mobile-logo">
        <img class="logo-light" src="./logo/logo1v2.png" alt="Cup of Jay">
        <img class="logo-dark" src="./logo/logo1v1.png" alt="Cup of Jay">
    </div>

    <!-- Mobile Burger Menu -->
    <label for="mobile-nav-toggle" class="mobile-burger">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <!-- Mobile Nav Backdrop -->
    <label for="mobile-nav-toggle" class="mobile-nav__backdrop"></label>

    <!-- Full-width blur strip under the scrolled navbar -->
    <div class="nav-blur-strip" aria-hidden="true"></div>

    <!-- Mobile Nav Drawer -->
    <nav class="mobile-nav__drawer" aria-label="Mobile navigation">
        <div class="mobile-nav__header">
            <img class="logo-light mobile-nav__header-logo" src="./logo/logo1v2.png" alt="Cup of Jay">
            <img class="logo-dark mobile-nav__header-logo" src="./logo/logo1v1.png" alt="Cup of Jay">
            <span class="mobile-nav__header-name">Cup of Jay</span>
        </div>
        <ul class="mobile-nav__list">
            <!-- Rendered by js/nav.js from the single PAGES source -->
        </ul>
    </nav>

    <!-- Desktop Navigation (outside hero so fixed positioning works correctly) -->
    <nav class="nav" aria-label="Main navigation">
        <!-- Logo floats above the nav, centered, out of flow -->
        <div class="nav__logo-item">
            <img class="nav__logo-image logo-light" src="./logo/logo1v2.png" alt="Cup of Jay">
            <img class="nav__logo-image logo-dark" src="./logo/logo1v1.png" alt="Cup of Jay">
        </div>
        <ul class="nav__main-list">
            <!-- Rendered by js/nav.js from the single PAGES source -->
        </ul>
    </nav>

    <!-- Theme toggle — standalone, always visible -->
    <div class="nav__toggle-item">
        <div class="theme-toggle theme-toggle--nav">
            <label class="switch" for="theme-checkbox" aria-label="Toggle theme">
                <input type="checkbox" id="theme-checkbox" class="theme-toggle__input">
                <span class="slider">
                    <span class="stars">
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                        <svg class="star" viewBox="0 0 24 24"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>
                    </span>
                    <span class="moons-hole">
                        <span class="moon-hole"></span>
                        <span class="moon-hole"></span>
                        <span class="moon-hole"></span>
                    </span>
                    <span class="black-clouds">
                        <span class="black-cloud"></span>
                        <span class="black-cloud"></span>
                        <span class="black-cloud"></span>
                    </span>
                    <span class="clouds">
                        <span class="cloud"></span>
                        <span class="cloud"></span>
                        <span class="cloud"></span>
                        <span class="cloud"></span>
                        <span class="cloud"></span>
                        <span class="cloud"></span>
                        <span class="cloud"></span>
                        <span class="cloud"></span>
                    </span>
                </span>
            </label>
        </div>
    </div>

    <!-- 02 — Retouching: full roll, drag each divider to compare raw vs graded.
         To add a plate: copy a .ba-item figure, swap both img srcs (before first,
         after second) and keep the two urls' dimensions identical. -->
    <main class="gallery-section-main">
        <div class="gallery-section__crumbs">
            <a href="gallery.html">Gallery</a>
            <span aria-hidden="true">/</span>
            <span>02 — Retouching</span>
        </div>
        <h1 class="gallery-section__title">Retouching</h1>
        <p class="gallery-section__intro">Cleanup, beauty work and restoration — the invisible craft. Drag each divider to see the raw frame against the finished retouch.</p>

        <p class="gallery-section__hint">drag a divider — before / after</p>

        <div class="ba-grid">
            <figure class="ba-item">
                <div class="ba" tabindex="0" role="slider" aria-label="Skin &amp; Tone — before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                    <img class="ba__before" src="https://picsum.photos/seed/g2a/900/560" alt="Skin &amp; Tone — raw ungraded frame" draggable="false">
                    <img src="https://picsum.photos/seed/g2a/900/560" alt="Skin &amp; Tone — finished grade" draggable="false">
                    <div class="ba__divider" aria-hidden="true"></div>
                    <div class="ba__handle" aria-hidden="true">
                        <svg class="ba__grip" viewBox="0 0 18 18" fill="none"><path d="M6 4 2 9l4 5M12 4l4 5-4 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <span class="ba__label ba__label--before">Before</span>
                    <span class="ba__label ba__label--after">After</span>
                </div>
                <figcaption><span class="ba-item__name">Skin &amp; Tone</span><span class="gallery-ledger__tag">Beauty</span></figcaption>
            </figure>
            <figure class="ba-item">
                <div class="ba" tabindex="0" role="slider" aria-label="Product Polish — before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                    <img class="ba__before" src="https://picsum.photos/seed/g2b/900/560" alt="Product Polish — raw ungraded frame" draggable="false">
                    <img src="https://picsum.photos/seed/g2b/900/560" alt="Product Polish — finished grade" draggable="false">
                    <div class="ba__divider" aria-hidden="true"></div>
                    <div class="ba__handle" aria-hidden="true">
                        <svg class="ba__grip" viewBox="0 0 18 18" fill="none"><path d="M6 4 2 9l4 5M12 4l4 5-4 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <span class="ba__label ba__label--before">Before</span>
                    <span class="ba__label ba__label--after">After</span>
                </div>
                <figcaption><span class="ba-item__name">Product Polish</span><span class="gallery-ledger__tag">Commercial</span></figcaption>
            </figure>
            <figure class="ba-item">
                <div class="ba" tabindex="0" role="slider" aria-label="Portrait Detail — before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                    <img class="ba__before" src="https://picsum.photos/seed/g2c/900/560" alt="Portrait Detail — raw ungraded frame" draggable="false">
                    <img src="https://picsum.photos/seed/g2c/900/560" alt="Portrait Detail — finished grade" draggable="false">
                    <div class="ba__divider" aria-hidden="true"></div>
                    <div class="ba__handle" aria-hidden="true">
                        <svg class="ba__grip" viewBox="0 0 18 18" fill="none"><path d="M6 4 2 9l4 5M12 4l4 5-4 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <span class="ba__label ba__label--before">Before</span>
                    <span class="ba__label ba__label--after">After</span>
                </div>
                <figcaption><span class="ba-item__name">Portrait Detail</span><span class="gallery-ledger__tag">Beauty</span></figcaption>
            </figure>
            <figure class="ba-item">
                <div class="ba" tabindex="0" role="slider" aria-label="Restore &amp; Repair — before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                    <img class="ba__before" src="https://picsum.photos/seed/g2d/900/560" alt="Restore &amp; Repair — raw ungraded frame" draggable="false">
                    <img src="https://picsum.photos/seed/g2d/900/560" alt="Restore &amp; Repair — finished grade" draggable="false">
                    <div class="ba__divider" aria-hidden="true"></div>
                    <div class="ba__handle" aria-hidden="true">
                        <svg class="ba__grip" viewBox="0 0 18 18" fill="none"><path d="M6 4 2 9l4 5M12 4l4 5-4 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <span class="ba__label ba__label--before">Before</span>
                    <span class="ba__label ba__label--after">After</span>
                </div>
                <figcaption><span class="ba-item__name">Restore &amp; Repair</span><span class="gallery-ledger__tag">Restoration</span></figcaption>
            </figure>
            <figure class="ba-item">
                <div class="ba" tabindex="0" role="slider" aria-label="Vanity Flip — before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                    <img class="ba__before" src="https://picsum.photos/seed/g2e/900/560" alt="Vanity Flip — raw ungraded frame" draggable="false">
                    <img src="https://picsum.photos/seed/g2e/900/560" alt="Vanity Flip — finished grade" draggable="false">
                    <div class="ba__divider" aria-hidden="true"></div>
                    <div class="ba__handle" aria-hidden="true">
                        <svg class="ba__grip" viewBox="0 0 18 18" fill="none"><path d="M6 4 2 9l4 5M12 4l4 5-4 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <span class="ba__label ba__label--before">Before</span>
                    <span class="ba__label ba__label--after">After</span>
                </div>
                <figcaption><span class="ba-item__name">Vanity Flip</span><span class="gallery-ledger__tag">Commercial</span></figcaption>
            </figure>
            
        </div>

        <div class="gallery-section__end">
            <a class="gallery-ledger__more" href="gallery.html">
                <svg class="gallery-ledger__more-icon" viewBox="0 0 16 16" aria-hidden="true" style="transform: none;"><path d="M3.5 8 9 2.5l1.4 1.4L6.3 8l4.1 4.1L9 13.5Z" fill="currentColor"/></svg>
                <span class="gallery-ledger__more-text">Back to gallery</span>
            </a>
        </div>
    </main>

    <script type="module" src="main.js?v=9"></script>
    <script src="lib/libgif.js"></script>
    <script src="lib/web-pet-engine.js"></script>
</body>
</html>
